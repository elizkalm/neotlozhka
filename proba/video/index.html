<head>

<style>
/* ==========================================================================
   Экран «Вот что вы получите» — повтор исходного блока под перенос в Tilda.

   Все размеры сняты с живой страницы, не на глаз:
     секция      padding 72/32, ширина 1180, gap 36
     заголовок   48 / 700, межстрочное 48, трекинг −2.4
     лента       flex, gap 18, горизонтальная прокрутка
     карточка    420 ширина, фон #141617, радиус 10, padding 12, gap 18
     кадр        396×290, радиус 6, object-fit cover
     play        44×44, круг #B6F66B, значок 18×18 чёрный, 16 от края
     подпись     строка, padding 0 4 4, прижата по нижнему краю
     название    17 / 600, межстрочное 18.7, #F3F4F0
     мета        13 / 500, межстрочное 13, #868B87

   Исходник на узких ширинах не адаптирован: карточка остаётся 420, заголовок
   48, и на телефоне блок уезжает за экран. Ниже 640 сделано по-человечески —
   это единственное отступление от оригинала.
   ========================================================================== */

:root{
  --bg:#0B0C0D;
  --card:#141617;
  --text:#F3F4F0;
  --muted:#868B87;
  --accent:#B6F66B;
  --font:'Clash Grotesk','Inter',-apple-system,'Segoe UI',Arial,sans-serif;
}

*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
  -webkit-font-smoothing:antialiased;}

.section{max-width:1180px;margin:0 auto;padding:72px 32px;
  display:flex;flex-direction:column;align-items:flex-start;gap:36px;}

.section__title{margin:0;font-size:48px;line-height:48px;font-weight:700;
  letter-spacing:-2.4px;color:var(--text);}

/* Лента: в исходнике это горизонтальная прокрутка, третья карточка
   намеренно выглядывает за край. Прокрутку оставляю, добавляю только
   прилипание к карточке и прячу полосу — вида это не меняет. */
.strip{display:flex;gap:18px;width:100%;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scrollbar-width:none;-ms-overflow-style:none;}
.strip::-webkit-scrollbar{display:none;}

.card{flex:0 0 420px;width:420px;background:var(--card);border-radius:10px;
  padding:12px;display:flex;flex-direction:column;gap:18px;
  border:0;margin:0;text-align:left;color:inherit;font:inherit;cursor:pointer;
  scroll-snap-align:start;}

.card__frame{position:relative;width:100%;aspect-ratio:396/290;
  border-radius:6px;overflow:hidden;background:#0B0C0D;}
.card__frame img{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block;}

.card__play{position:absolute;left:16px;bottom:16px;width:44px;height:44px;
  border-radius:100px;background:var(--accent);display:flex;
  align-items:center;justify-content:center;}

.card__row{display:flex;align-items:flex-end;justify-content:space-between;
  gap:12px;padding:0 4px 4px;}
/* Название в одну строку: в исходнике оно занимает ровно 228 и не переносится,
   перенос добавлял карточке лишние 18 px высоты. */
.card__name{font-size:17px;line-height:18.7px;font-weight:600;color:var(--text);
  white-space:nowrap;}
.card__meta{font-size:13px;line-height:13px;font-weight:500;color:var(--muted);
  white-space:nowrap;}

/* Узкие ширины — отступление от исходника, см. комментарий выше.
   Карточка сжимается по экрану, следующая выглядывает краем. */
@media (max-width:639px){
  .section{padding:56px 20px;gap:28px;}
  .section__title{font-size:34px;line-height:34px;letter-spacing:-1.4px;}
  .strip{gap:12px;}
  .card{flex:0 0 82vw;width:82vw;}
  /* Название и мета в строку на телефоне не помещаются — ставлю друг под друга */
  .card__row{flex-direction:column;align-items:flex-start;gap:6px;}
}

@media (max-width:479px){
  .section__title{font-size:30px;line-height:30px;letter-spacing:-1.2px;}
}
</style>
</head>
