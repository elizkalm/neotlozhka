<style>
/* ==========================================================================
   Экран «Вот что вы получите» — пересборка под перенос в Tilda Zero Block.

   Что взято с исходной страницы без изменений: тексты карточек, фотографии,
   шрифт Clash Grotesk, цвета (фон 0B0C0D, текст F3F4F0, акцент B6F66B).

   Что сделано иначе: карточки стоят сеткой и не обрезаются правым краем,
   у всех одинаковая пропорция кадра 16:9, подпись и мета в одной строке
   по базовой линии. Контейнер 1200 — сетка Zero Block, чтобы импорт лёг
   без подгонки. Брейкпоинты те же, что у Тильды: 1200 / 980 / 640 / 480.
   ========================================================================== */

:root{
  --bg:#0B0C0D;
  --card:#141617;
  --text:#F3F4F0;
  --muted:#868B87;
  --accent:#B6F66B;
  --radius:16px;
  --font:'Clash Grotesk','Inter',-apple-system,'Segoe UI',Arial,sans-serif;
}

*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
  -webkit-font-smoothing:antialiased;}

.section{padding:120px 0;background:var(--bg);}
.container{max-width:1200px;margin:0 auto;padding:0 24px;}

.section__head{display:flex;align-items:flex-end;justify-content:space-between;
  gap:32px;margin:0 0 48px;}
.section__title{margin:0;font-size:56px;line-height:1.02;font-weight:500;
  letter-spacing:-.02em;}
.section__count{margin:0;font-size:16px;line-height:1.4;color:var(--muted);
  white-space:nowrap;}

/* Сетка примеров: три в ряд, карточки равной высоты, ничего не обрезается */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}

.card{display:flex;flex-direction:column;gap:16px;background:transparent;
  border:0;padding:0;margin:0;text-align:left;color:inherit;font:inherit;
  cursor:pointer;}

.card__frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;
  border-radius:var(--radius);background:var(--card);}
.card__frame img{width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .4s ease;}
.card:hover .card__frame img{transform:scale(1.04);}

.card__play{position:absolute;left:16px;bottom:16px;width:44px;height:44px;
  border-radius:50%;background:var(--accent);display:flex;align-items:center;
  justify-content:center;transition:transform .2s ease;}
.card:hover .card__play{transform:scale(1.08);}

/* Название и мета стоят друг под другом, а не в строку: в исходнике они были
   в одну строку, но там карточки шире. На трёх в ряд длинное название
   переносится, мета остаётся у первой строки — ряд выглядит рваным. */
.card__row{display:flex;flex-direction:column;gap:4px;}
.card__name{font-size:18px;line-height:1.25;font-weight:500;letter-spacing:-.01em;}
.card__meta{font-size:14px;line-height:1.3;color:var(--muted);}

@media (max-width:1199px){
  .section{padding:96px 0;}
  .section__title{font-size:48px;}
}

@media (max-width:979px){
  .grid{grid-template-columns:repeat(2,1fr);}
  .section__title{font-size:40px;}
  .section__head{margin-bottom:40px;}
}

@media (max-width:639px){
  .section{padding:72px 0;}
  .grid{grid-template-columns:1fr;gap:20px;}
  .section__head{flex-direction:column;align-items:flex-start;gap:12px;
    margin-bottom:32px;}
  .section__title{font-size:34px;}
}

@media (max-width:479px){
  .container{padding:0 20px;}
  .section__title{font-size:30px;}
}
</style>
</head>
