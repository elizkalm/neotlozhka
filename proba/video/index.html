<title>Вот что вы получите — Видео на выставке</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600,700&display=swap">
<style>
/* ==========================================================================
   Экран «Вот что вы получите» — под перенос в Tilda Zero Block.

   ОФОРМЛЕНИЕ карточки повторяет оригинал, числа сняты с живой страницы:
     карточка  фон #141617, радиус 10, padding 12, внутренний отступ 18
     кадр      пропорция 396×290, радиус 6
     play      44×44, круг #B6F66B, значок 18×18 чёрный, 16 от края
     подпись   строка, padding 0 4 4, прижата по нижнему краю
     название  17 / 600, межстрочное 18.7, #F3F4F0
     мета      13 / 500, межстрочное 13, #868B87
     заголовок 48 / 700, межстрочное 48, трекинг −2.4
     секция    1180, padding 72/32, отступ до карточек 36

   РАСКЛАДКА сделана иначе. В оригинале это лента с прокруткой, и третья
   карточка срезана краем — это и есть то, что чиним. Здесь сетка: шесть
   карточек видны целиком, 3 в ряд, на планшете 2, на телефоне 1.

   Всё собрано так, чтобы импортёр перевёл это в авто-лейаут:
   нигде нет фиксированных размеров, aspect-ratio и абсолютного
   позиционирования, кроме одной кнопки play поверх кадра. Фотографии
   заранее обрезаны под пропорцию кадра, поэтому высоту задавать не надо —
   кадр тянется по картинке, а картинка по ширине карточки.
   ========================================================================== */

:root{
  --bg:#0B0C0D;
  --card:#141617;
  --text:#F3F4F0;
  --muted:#868B87;
  --accent:#B6F66B;
  --font:'Clash Grotesk','Inter',-apple-system,'Segoe UI',Arial,sans-serif;
}

*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
  -webkit-font-smoothing:antialiased;}

.section{max-width:1180px;margin:0 auto;padding:72px 32px;
  display:flex;flex-direction:column;align-items:stretch;gap:36px;}

.section__title{margin:0;font-size:48px;line-height:48px;font-weight:700;
  letter-spacing:-2.4px;color:var(--text);}

/* Ряд собран на флексе с переносом, а не на сетке. Сетку импортёр не
   понимает: он разворачивает её во флекс, но карточкам внутри нечего
   сказать про растяжение, и они приходят в Tilda фиксированного размера.
   У флекса каждая карточка несёт flex-grow — импортёр читает это как
   «заполнить». 30% — основа, по которой встают три в ряд. */
.grid{display:flex;flex-wrap:wrap;gap:18px;}

.card{flex:1 1 30%;min-width:0;background:var(--card);border-radius:10px;padding:12px;
  display:flex;flex-direction:column;gap:18px;
  border:0;margin:0;text-align:left;color:inherit;font:inherit;cursor:pointer;}

/* Кадр без заданной высоты: картинка уже обрезана под нужную пропорцию,
   поэтому высота берётся от неё и всё тянется само. */
.card__frame{position:relative;width:100%;border-radius:6px;overflow:hidden;
  background:#0B0C0D;line-height:0;}
.card__frame img{display:block;width:100%;height:auto;}

.card__play{position:absolute;left:16px;bottom:16px;width:44px;height:44px;
  border-radius:100px;background:var(--accent);display:flex;
  align-items:center;justify-content:center;}

/* В оригинале название и мета стоят в строку, но там карточка 420 в ленте.
   В сетке по три карточка 360, и в строку они не помещаются ни при каком
   кегле. Ставлю друг под друга — иначе мета переносится вразнобой. */
.card__row{display:flex;flex-direction:column;align-items:flex-start;
  gap:6px;padding:0 4px 4px;}
.card__name{font-size:17px;line-height:18.7px;font-weight:600;color:var(--text);
  min-width:0;}
.card__meta{font-size:13px;line-height:13px;font-weight:500;color:var(--muted);
  white-space:nowrap;}

/* Планшет */
/* Переход на две колонки делаю до 980, а не после: Tilda снимает макет
   ровно на 980, и три карточки по 293 там были бы мелковаты для видео. */
@media (max-width:1023px){
  .section{padding:64px 28px;gap:28px;}
  .section__title{font-size:40px;line-height:40px;letter-spacing:-1.8px;}
  .card{flex:1 1 45%;}   /* две в ряд */
}

/* Телефон. В оригинале этот блок не адаптирован вовсе: карточка остаётся
   420 и уезжает за экран. Здесь одна в ряд, подпись в две строки. */
@media (max-width:639px){
  .section{padding:56px 20px;gap:24px;}
  .section__title{font-size:34px;line-height:34px;letter-spacing:-1.4px;}
  .grid{gap:14px;}
  .card{flex:1 1 100%;}  /* одна в ряд */
}

@media (max-width:479px){
  .section__title{font-size:30px;line-height:30px;letter-spacing:-1.2px;}
}
</style>
</head>
